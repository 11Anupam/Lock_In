<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discipline Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#FFF4D6;--ink:#111;--card:#fff;--sh:#111;--mu:#555;--dot:rgba(0,0,0,.12);--y:#FFD93D;--p:#FF6B9D;--g:#4ADE80;--o:#FF9F43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--ink:#f5f5f0;--card:#24242c;--sh:#f5f5f0;--mu:#aaa;--dot:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#17171c;--ink:#f5f5f0;--card:#24242c;--sh:#f5f5f0;--mu:#aaa;--dot:rgba(255,255,255,.1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:20px 20px;color:var(--ink);font:500 16px/1.4 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:700px;margin:0 auto;padding:16px}
.top{margin-bottom:16px}
h1{display:inline-block;margin:0;padding:4px 14px;font-size:28px;letter-spacing:.02em;background:var(--y);color:#111;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--sh);transform:rotate(-1.5deg)}
h1 span{background:#111;color:var(--y);padding:0 6px;margin-left:6px}
.q{margin-top:12px;font-weight:700;font-size:14px}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.tabs button{flex:1;font:inherit;font-weight:700;text-transform:uppercase;padding:10px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sh);cursor:pointer}
.tabs button.on{background:var(--p);color:#111;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--sh)}
.btn{font:inherit;font-weight:700;text-transform:uppercase;border:3px solid var(--ink);background:var(--y);color:#111;padding:9px 14px;box-shadow:4px 4px 0 var(--sh);cursor:pointer}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--sh)}
.btn.w2{background:var(--card);color:var(--ink)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px;margin-bottom:18px;border:3px solid #111;box-shadow:7px 7px 0 var(--sh);color:#111;background:var(--hb)}
.fb{position:relative;width:150px;height:200px;flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:rgba(255,255,255,.4);border:3px solid #111}
.hi{flex:1;min-width:140px}
.big{font-size:72px;line-height:.9;font-weight:700}
.lab{font-weight:700;letter-spacing:.08em;font-size:13px}
.tag{display:inline-block;background:#111;color:#fff;padding:2px 10px;margin:8px 0 4px;transform:rotate(-2deg);font-weight:700;letter-spacing:.06em}
.msg{font-size:14px;font-weight:700;margin:6px 0 10px}
.mb{height:18px;border:3px solid #111;background:#fff}
.mb i{display:block;height:100%;background:#111;transition:width .4s}
.ms{font-size:12px;font-weight:700;margin-top:4px}
.fl{transform-origin:50% 100%;animation:fl 1.1s ease-in-out infinite alternate;position:relative;z-index:1}
.fl .in{transform-origin:50% 100%;animation:fl .8s ease-in-out infinite alternate-reverse}
.fl.lit{filter:drop-shadow(0 0 14px #FF9F1C)}
.fl.rk{filter:saturate(.5) brightness(.9);animation-duration:2s}
.fl.cold{filter:grayscale(1);opacity:.55;animation-duration:2.6s}
@keyframes fl{from{transform:scale(1,1) rotate(-1.5deg)}to{transform:scale(.95,1.07) rotate(1.5deg)}}
.em{position:absolute;bottom:16px;width:9px;height:9px;background:#FF9F1C;border:2px solid #111;opacity:0;animation:rise 2.4s linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-175px) rotate(200deg);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{padding:10px 6px;text-align:center;background:var(--card);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sh)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:700}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.nav b{font-size:17px;text-transform:uppercase;background:var(--card);border:3px solid var(--ink);padding:4px 12px;text-align:center}
.seg{display:flex;gap:4px;margin:0 0 16px}
.seg i{flex:1;height:18px;border:3px solid var(--ink);background:var(--card)}
.seg i.f{background:var(--c)}
.win{background:var(--g);color:#111;border:3px solid #111;box-shadow:5px 5px 0 var(--sh);padding:10px;text-align:center;font-weight:700;text-transform:uppercase;margin-bottom:14px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.8) rotate(-3deg)}60%{transform:scale(1.06) rotate(1deg)}100%{transform:scale(1)}}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:12px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sh);cursor:pointer;user-select:none}
.row:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.row.on{background:var(--c);color:#111}
.row.pp{animation:pop .4s}
.ck{width:30px;height:30px;border:3px solid var(--ink);background:var(--card);display:grid;place-items:center;font-size:20px;font-weight:700;color:#111;flex:none}
.row.on .ck{background:#fff;border-color:#111}
.nm{flex:1;font-weight:700;font-size:17px}
.sk{display:flex;align-items:center;gap:4px}
.sk b{background:#111;color:#fff;padding:1px 7px;font-size:14px}
.sk .z{opacity:.3;filter:grayscale(1)}
.x{border:3px solid #111;background:#FF5A5A;color:#111;font-weight:700;cursor:pointer;padding:0 9px;font-size:18px}
.add{display:flex;gap:10px;margin-top:6px}
input[type=text]{flex:1;min-width:0;padding:10px 12px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;box-shadow:4px 4px 0 var(--sh)}
.gl{display:inline-block;margin:6px 0 12px;padding:2px 10px;background:var(--ink);color:var(--bg);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.05em}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:10px;background:var(--card);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--sh)}
.note span{flex:1;white-space:pre-wrap;word-break:break-word}
.note small{color:var(--mu);font-weight:700}
.em0{color:var(--mu);font-weight:700;padding:4px 0 12px}
.sc{overflow-x:auto;padding:0 6px 8px 0;margin-bottom:12px}
table{border-collapse:separate;border-spacing:0;font-size:12px;font-weight:700}
th{min-width:26px;padding:2px;text-align:center;color:var(--mu)}
th.t{background:var(--y);color:#111;border:2px solid var(--ink)}
td{padding:2px;text-align:center}
td.h{text-align:left;white-space:nowrap;padding-right:10px;position:sticky;left:0;background:var(--bg);font-size:13px}
td.c{cursor:pointer}
td.c i{display:block;width:22px;height:22px;border:2px solid var(--ink);background:var(--card)}
td.c.on i{background:var(--c)}
td.c.t i{outline:3px solid var(--ink);outline-offset:1px}
td.n{padding-left:8px;color:var(--mu)}
.score{font-weight:700;margin:0 0 12px;font-size:15px}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>DISCIPLINE<span>.exe</span></h1><div class="q" id="q"></div></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
</div>
<script>
var KEY='discipline-v1',S=null;
var P=['#FFD93D','#FF6B9D','#5CA4FF','#4ADE80','#FF9F43','#B388FF','#2DD4BF','#F87171'];
var LV=[[0,'COLD','#C9D6FF'],[1,'SPARK','#FFE14D'],[3,'FLAME','#FFB347'],[7,'BLAZE','#FF8A5B'],[14,'INFERNO','#FF6B6B'],[30,'WILDFIRE','#FF4D8D'],[60,'SUPERNOVA','#B388FF']];
var MS=[3,7,14,30,60,100,200,365];
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var QS=['Do it tired. Do it bored. Do it anyway.','Motivation fades. Systems don’t.','Your future self is watching today.','One day at a time. Stack the days.','Discipline is choosing what you want most over what you want now.','Small wins, every single day.','Don’t break the chain.'];
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
function uid(){return Math.random().toString(36).slice(2,8)}
if(!S||!S.habits){S={habits:['No fap','Meditation','Workout','Wake up early','Deep work'].map(function(n){return{id:uid(),name:n}}),logs:{},notes:{},goals:{}}}
if(!S.v2){['Reading','Writing','Study'].forEach(function(nm){if(!S.habits.some(function(h){return h.name.toLowerCase()===nm.toLowerCase()}))S.habits.push({id:uid(),name:nm})});S.v2=1}
S.habits.forEach(function(h,i){if(!h.c)h.c=P[i%P.length]});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ms(d){return ds(d).slice(0,7)}
function pd(k){return new Date(k+'T00:00')}
function ad(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tab='today',cur=new Date(),mo=new Date(),edit=false,pop=null;mo.setDate(1);
function done(d,h){return !!(S.logs[d]&&S.logs[d][h])}
function cnt(d){return S.habits.filter(function(h){return done(d,h.id)}).length}
function need(){return Math.max(1,Math.ceil(S.habits.length*.6))}
function qual(d){return S.habits.length>0&&cnt(d)>=need()}
function toggle(d,h){S.logs[d]=S.logs[d]||{};if(S.logs[d][h])delete S.logs[d][h];else S.logs[d][h]=1;save()}
function hstreak(h){var d=new Date();if(!done(ds(d),h))d=ad(d,-1);var n=0;while(done(ds(d),h)){n++;d=ad(d,-1)}return n}
function cstreak(){var d=new Date();if(!qual(ds(d)))d=ad(d,-1);var n=0;while(qual(ds(d))){n++;d=ad(d,-1)}return n}
function best(){var ks=Object.keys(S.logs).filter(qual),set={},b=0;ks.forEach(function(k){set[k]=1});ks.forEach(function(k){if(set[ds(ad(pd(k),-1))])return;var n=0,x=pd(k);while(set[ds(x)]){n++;x=ad(x,1)}if(n>b)b=n});return b}
function xp(){var n=0;for(var d in S.logs)n+=Object.keys(S.logs[d]).length;return n}
function lv(n){var r=LV[0];LV.forEach(function(x){if(n>=x[0])r=x});return r}
function flame(n,lit,risk){
 var s=n?Math.min(60+Math.min(n,40)*2.5,160):44,c='fl'+(n?'':' cold')+(risk?' rk':'')+(lit&&n?' lit':'');
 return '<svg class="'+c+'" style="width:'+s+'px;height:'+Math.round(s*1.2)+'px" viewBox="0 0 100 120" stroke="#111" stroke-width="5" stroke-linejoin="round"><path fill="#FF4D2E" d="M50 4C54 26 82 42 82 78C82 101 68 116 50 116C32 116 18 101 18 78C18 60 28 50 34 36C38 46 42 50 46 52C44 34 46 18 50 4Z"/><path class="in" fill="#FF9F1C" d="M50 40C54 58 72 66 72 88C72 104 62 114 50 114C38 114 28 104 28 88C28 76 36 70 40 60C44 66 46 68 48 68C46 56 47 48 50 40Z"/><path class="in" fill="#FFE14D" d="M50 72C53 82 62 86 62 98C62 108 56 114 50 114C44 114 38 108 38 98C38 90 44 86 46 80C48 84 49 85 50 72Z"/></svg>'}
function embers(n){var h='',k=Math.min(n,18);for(var i=0;i<k;i++){var r=Math.abs(Math.sin(i*12.9898)*43758.5453)%1;h+='<b class="em" style="left:'+(12+Math.round(r*70))+'%;animation-delay:'+(i*.37).toFixed(2)+'s;animation-duration:'+(1.8+r*1.4).toFixed(2)+'s"></b>'}return h}
function hero(){
 var n=cstreak(),L=lv(n),tk=ds(new Date()),lit=qual(tk),risk=n>0&&!lit,t=S.habits.length,left=Math.max(0,need()-cnt(tk));
 var nm=MS.filter(function(m){return m>n})[0]||n+100,pm=MS.filter(function(m){return m<=n}).pop()||0,pc=Math.round((n-pm)/(nm-pm)*100);
 var msg=!t?'Add a habit to start.':lit?'Today’s locked in. Come back tomorrow and the fire grows.':n>0?'Your fire dies tonight if you skip. Do '+left+' more habit'+(left>1?'s':'')+'.':'Light your first spark: finish '+need()+' habits today.';
 return '<div class="hero" style="--hb:'+L[2]+'"><div class="fb">'+embers(n)+flame(n,lit,risk)+'</div><div class="hi"><div class="big">'+n+'</div><div class="lab">DAY STREAK</div><div class="tag">'+L[1]+'</div><div class="msg">'+msg+'</div><div class="mb"><i style="width:'+pc+'%"></i></div><div class="ms">Next milestone: day '+nm+'</div></div></div>'+
 '<div class="stats"><div class="stat"><b>'+best()+'</b><small>Best streak</small></div><div class="stat"><b>'+xp()+'</b><small>Check-ins</small></div><div class="stat"><b>'+cnt(tk)+'/'+t+'</b><small>Today</small></div></div>'}
function today(){
 var d=ds(cur),isT=d===ds(new Date()),t=S.habits.length,n=cnt(d);
 var h=hero()+'<div class="nav"><button class="btn w2" data-a="day" data-v="-1">‹</button><b>'+(isT?'Today':cur.toLocaleDateString(undefined,{weekday:'long'}))+' · '+cur.getDate()+' '+MN[cur.getMonth()].slice(0,3)+'</b><button class="btn w2" data-a="day" data-v="1">›</button></div>';
 h+='<div class="seg">'+S.habits.map(function(x){return '<i class="'+(done(d,x.id)?'f':'')+'" style="--c:'+x.c+'"></i>'}).join('')+'</div>';
 if(t&&n===t)h+='<div class="win">All done. Fire fed. See you tomorrow 🔥</div>';
 S.habits.forEach(function(x){var on=done(d,x.id),st=hstreak(x.id);
  h+='<div class="row'+(on?' on':'')+(pop===x.id?' pp':'')+'" style="--c:'+x.c+'" data-a="tog" data-h="'+x.id+'"><div class="ck">'+(on?'✓':'')+'</div><div class="nm">'+esc(x.name)+'</div>'+(edit?'<button class="x" data-a="del" data-h="'+x.id+'">×</button>':'<div class="sk">'+(st?'<span style="font-size:'+Math.round(18+Math.min(st,30)*1.1)+'px">🔥</span><b>'+st+'</b>':'<span class="z">🔥</span>')+'</div>')+'</div>'});
 h+='<div class="add"><input type="text" id="nh" placeholder="New habit…"><button class="btn" data-a="addh">Add</button><button class="btn w2" data-a="edit">'+(edit?'Done':'Edit')+'</button></div>';
 h+='<div style="margin-top:22px"><div class="gl">Quick notes</div>';
 var ns=S.notes[d]||[];
 if(!ns.length)h+='<div class="em0">Nothing logged for this day.</div>';
 ns.forEach(function(x,i){h+='<div class="note"><span>'+esc(x.t)+' <small>'+esc(x.time)+'</small></span><button class="x" data-a="deln" data-i="'+i+'">×</button></div>'});
 return h+'<div class="add"><input type="text" id="nn" placeholder="Short note…"><button class="btn" data-a="addn">Log</button></div></div>'}
function month(){
 var y=mo.getFullYear(),m=mo.getMonth(),N=new Date(y,m+1,0).getDate(),k=ms(mo),td=ds(new Date()),tot=0,pas=0;
 var h='<div class="nav"><button class="btn w2" data-a="mon" data-v="-1">‹</button><b>'+MN[m]+' '+y+'</b><button class="btn w2" data-a="mon" data-v="1">›</button></div><div class="sc"><table><tr><th></th>';
 for(var i=1;i<=N;i++)h+='<th'+(k+'-'+String(i).padStart(2,'0')===td?' class="t"':'')+'>'+i+'</th>';
 h+='<th></th></tr>';
 S.habits.forEach(function(x){var c=0;h+='<tr style="--c:'+x.c+'"><td class="h">'+esc(x.name)+'</td>';
  for(var i=1;i<=N;i++){var d=k+'-'+String(i).padStart(2,'0'),on=done(d,x.id);if(on)c++;if(d<=td)pas++;h+='<td class="c'+(on?' on':'')+(d===td?' t':'')+'" data-a="cell" data-h="'+x.id+'" data-d="'+d+'"><i></i></td>'}
  tot+=c;h+='<td class="n">'+c+'/'+N+'</td></tr>'});
 h+='</table></div><div class="score">Month score: '+(pas?Math.round(tot/pas*100):0)+'%</div><div class="gl">Monthly checklist</div>';
 var g=S.goals[k]||[];
 if(!g.length)h+='<div class="em0">Add goals for '+MN[m]+'.</div>';
 g.forEach(function(x){h+='<div class="row'+(x.done?' on':'')+'" style="--c:#FFD93D" data-a="tg" data-g="'+x.id+'"><div class="ck">'+(x.done?'✓':'')+'</div><div class="nm">'+esc(x.text)+'</div><button class="x" data-a="delg" data-g="'+x.id+'">×</button></div>'});
 return h+'<div class="add"><input type="text" id="ng" placeholder="Monthly goal…"><button class="btn" data-a="addg">Add</button></div>'}
function journal(){
 var ks=Object.keys(S.notes).filter(function(d){return S.notes[d].length}).sort().reverse(),h='';
 if(!ks.length)h+='<div class="em0">No notes yet. Log some from the Today tab.</div>';
 ks.forEach(function(d){h+='<div class="gl">'+pd(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</div>';
  S.notes[d].forEach(function(x){h+='<div class="note"><span>'+esc(x.t)+' <small>'+esc(x.time)+'</small></span></div>'})});
 return h}
function render(){
 document.getElementById('q').textContent=QS[new Date().getDate()%QS.length];
 document.getElementById('tabs').innerHTML=[['today','Today'],['month','Month'],['journal','Notes']].map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
 document.getElementById('app').innerHTML=tab==='today'?today():tab==='month'?month():journal();pop=null}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,d=ds(cur),k=ms(mo),v;
 if(a==='tab')tab=el.dataset.v;
 else if(a==='day')cur=ad(cur,+el.dataset.v);
 else if(a==='mon')mo.setMonth(mo.getMonth()+ +el.dataset.v);
 else if(a==='tog'){toggle(d,el.dataset.h);if(done(d,el.dataset.h))pop=el.dataset.h}
 else if(a==='cell')toggle(el.dataset.d,el.dataset.h);
 else if(a==='edit')edit=!edit;
 else if(a==='del'){e.stopPropagation();if(confirm('Remove this habit?')){S.habits=S.habits.filter(function(h){return h.id!==el.dataset.h});save()}}
 else if(a==='addh'){v=val('nh');if(v){S.habits.push({id:uid(),name:v,c:P[S.habits.length%P.length]});save()}}
 else if(a==='addn'){v=val('nn');if(v){(S.notes[d]=S.notes[d]||[]).push({t:v,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});save()}}
 else if(a==='deln'){S.notes[d].splice(+el.dataset.i,1);save()}
 else if(a==='addg'){v=val('ng');if(v){(S.goals[k]=S.goals[k]||[]).push({id:uid(),text:v,done:false});save()}}
 else if(a==='tg'){S.goals[k].forEach(function(x){if(x.id===el.dataset.g)x.done=!x.done});save()}
 else if(a==='delg'){e.stopPropagation();S.goals[k]=S.goals[k].filter(function(x){return x.id!==el.dataset.g});save()}
 render()});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var m={nh:'addh',nn:'addn',ng:'addg'}[e.target.id];if(m){var b=document.querySelector('[data-a="'+m+'"]');if(b)b.click()}});
render();
</script>
</body>
</html>
